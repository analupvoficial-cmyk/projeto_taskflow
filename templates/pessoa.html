{% extends 'base.html' %}
{% block conteudo %}




<div class="container">

    <div class="cadastrar">
        <h1>Cadastro</h1>
        <hr>
        <br>
        <form action="{{url_for('criar_atividade')}}" method="post">
            <label>
                Nome Completo:
                <input name="form_nome" type="text" placeholder="Nome Completo" required>
            </label>
            <br>
            <br>
            <label>
                Documento Válido:
                <input name="form_documento" type="text" placeholder="RG/CPF" required>
            </label>
            <label>
                Data de Nascimento:
                <input name="form_data" type="date" placeholder="Data de Nascimento" required>
            </label>
            <br>
            <br>
            <label>Gênero</label>
            <br>
            <br>
            <label>
                <input type='radio' name="form_tipo" value="Atividade Avaliativa">Feminino
                <br>
                <input type='radio' name="form_tipo" value="Atividade Diagnóstico">Masculino
                <br>
                <input type='radio' name="form_tipo" value="Atividade Coletiva">Outro
                <br>
                <input type='radio' name="form_tipo" value="Atividade para Casa">Prefiro não informar

            </label>
            <br>
            <br>
            <button type="submit">Salvar</button>
            <button type="reset">Limpar</button>
        </form>
    </div>
</div>

{% endblock conteudo %}
